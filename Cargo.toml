[package]
name = "upc-login"
version = "0.0.11"
edition = "2021"
description = "UPC (China University of Petroleum) campus network CLI login tool for Ruijie ePortal"
license = "MIT"
readme = "README.md"

[dependencies]
socket2 = "0.6"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
colored = "2"
indicatif = "0.17"
local-ip-address = "0.6"
dirs = "5"
signal-hook = "0.3"

# 守护进程日志用本机时区（macOS/Linux 走 localtime_r）
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows 上 signal-hook 只支持 Ctrl+C，守护进程的 Ctrl+C 由 ctrlc 处理
[target.'cfg(windows)'.dependencies]
ctrlc = "3"
