[package]
name = "upc-login"
version = "2.1.0"
edition = "2021"

[dependencies]
socket2 = "0.6"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
colored = "2"
indicatif = "0.17"
local-ip-address = "0.6"
dirs = "5"
signal-hook = "0.3"
ctrlc = "3"
